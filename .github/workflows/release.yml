name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        default: "v1.0.0"
      release_name:
        description: "Release title"
        required: false
        default: "Rock Screen v1.0.0"
      prerelease:
        description: "Mark this release as a prerelease"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build APK and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set release variables
        id: release_vars
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            NAME="Rock Screen ${GITHUB_REF_NAME}"
            PRERELEASE="false"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
            NAME="${{ github.event.inputs.release_name }}"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
            NAME="Rock Screen v1.0.${GITHUB_RUN_NUMBER}"
            PRERELEASE="false"
          fi

          SAFE_TAG="${TAG//\//-}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "safe_tag=${SAFE_TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Prepare CI environment files
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "GEMINI_API_KEY=${GEMINI_API_KEY:-MY_GEMINI_API_KEY}" > .env

      - name: Generate CI signing keystore
        shell: bash
        run: |
          keytool -genkeypair \
            -v \
            -keystore my-upload-key.jks \
            -storepass android \
            -alias upload \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Sayanth Rock,O=Rock Screen,C=IN"

      - name: Build release APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Copy APK for release upload
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [[ -z "$APK_PATH" ]]; then
            echo "No release APK found."
            exit 1
          fi

          OUTPUT_NAME="Rock_Screen-${{ steps.release_vars.outputs.safe_tag }}.apk"
          cp "$APK_PATH" "$OUTPUT_NAME"
          echo "path=${OUTPUT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rock_Screen-${{ steps.release_vars.outputs.safe_tag }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_vars.outputs.tag }}
          name: ${{ steps.release_vars.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.release_vars.outputs.prerelease }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
