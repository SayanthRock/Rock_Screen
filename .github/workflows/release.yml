name: Android CI & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        default: "v1.0.0"
      prerelease:
        description: "Mark this GitHub Release as a prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  APK_NAME: Rock-Screen

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Resolve release metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag || '' }}
          INPUT_PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          set -euo pipefail

          release_enabled=false
          release_tag=""
          prerelease=false

          if [ "$REF_TYPE" = "tag" ]; then
            release_enabled=true
            release_tag="$REF_NAME"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            release_enabled=true
            release_tag="${INPUT_TAG:-v1.0.0}"
            prerelease="$INPUT_PRERELEASE"
          fi

          if [ "$release_enabled" = "true" ]; then
            release_tag="${release_tag// /-}"
            if [ -z "$release_tag" ]; then
              echo "Release tag is empty."
              exit 1
            fi
            artifact_label="$release_tag"
          else
            artifact_label="$REF_NAME"
          fi

          artifact_label_safe="${artifact_label//\//-}"

          echo "RELEASE_ENABLED=$release_enabled" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"
          echo "ARTIFACT_LABEL=$artifact_label_safe" >> "$GITHUB_ENV"

      - name: Create env file
        run: |
          echo "GEMINI_API_KEY=${GEMINI_API_KEY:-MY_GEMINI_API_KEY}" > .env
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Decode release keystore when available
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_ENV"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare APK file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          rm -f release/*.apk

          apk_path="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk_path" ]; then
            echo "Release APK was not found."
            find app/build/outputs -name "*.apk" -print || true
            exit 1
          fi

          apk_file="release/${APK_NAME}-${ARTIFACT_LABEL}.apk"
          cp "$apk_path" "$apk_file"
          ls -lh release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}-${{ env.ARTIFACT_LABEL }}
          path: release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Rock Screen ${{ env.RELEASE_TAG }}
          files: release/*.apk
          prerelease: ${{ env.PRERELEASE == 'true' }}
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
